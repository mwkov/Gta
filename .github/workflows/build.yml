name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build signed release APK
        run: |
          gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SpoilerShield.apk
          # read by the app's "Update now" card: "<versionCode> <versionName>"
          echo "$(grep -m1 versionCode app/build.gradle | awk '{print $2}') $(grep -m1 versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")" > out/version.txt
          cat out/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SpoilerShield-apk
          path: out/SpoilerShield.apk

      - name: Publish as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spoiler Shield build ${{ github.run_number }}
          files: |
            out/SpoilerShield.apk
            out/version.txt
