name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build signed release APK
        run: |
          gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SpoilerShield.apk
          # read by the app's "Update now" card: "<versionCode> <versionName>"
          echo "$(grep -m1 versionCode app/build.gradle | awk '{print $2}') $(grep -m1 versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")" > out/version.txt
          cat out/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SpoilerShield-apk
          path: out/SpoilerShield.apk

      - name: New version? (releases are made only when the version number changes)
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(grep -m1 versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if gh release view "v$NAME" -R "${{ github.repository }}" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release (the app's Update button downloads it from here)
        if: steps.rel.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.name }}
          name: Spoiler Shield ${{ steps.rel.outputs.name }}
          body: |
            Already installed? Open Spoiler Shield and tap **Update now**.
            New here? Download **SpoilerShield.apk** below on your phone and open it.
          files: |
            out/SpoilerShield.apk
            out/version.txt
