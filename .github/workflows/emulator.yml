name: Emulator test

# Boots a real Android emulator, runs Spoiler Shield against a test harness with scripted
# swipes, and publishes recordings + measurements to the `test-results` branch.
on:
  push:
    branches: [main, baseline]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    # Pinned: the emulator needs audio libraries the newer runner image lacks.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build app and test harness
        run: gradle :app:assembleRelease :testapp:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator
        timeout-minutes: 15
        run: |
          set -x
          OUT="$RUNNER_TEMP/results"; mkdir -p "$OUT"
          ls -la /dev/kvm
          # The emulator needs these and newer Ubuntu runner images no longer ship them.
          if ! ldconfig -p | grep -q libpulse.so.0; then
            timeout 180 sudo apt-get update -qq || true
            timeout 180 sudo apt-get install -y -qq libpulse0 > /dev/null || true
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Plain AOSP image (no Google services): on a CI machine with no GPU, Play services alone
          # starve the CPU (they ANR'd in earlier runs) and every app answers slowly.
          IMG="system-images;android-34;default;x86_64"
          nproc; free -g
          yes | sdkmanager --install "$IMG" emulator platform-tools > /dev/null || true
          emulator -version | head -1
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" | grep "not found" || echo "all emulator libraries found"
          emulator -accel-check || true
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd -n t -k "$IMG" -d pixel_6 -p "$ANDROID_AVD_HOME/t.avd" --force
          # Same phone in dp, at half the size: without a GPU every frame is drawn by the CPU,
          # and at full size apps managed only a few frames a second (nothing like a phone).
          sed -i -e '/^hw.lcd.width/d' -e '/^hw.lcd.height/d' -e '/^hw.lcd.density/d' "$ANDROID_AVD_HOME/t.avd/config.ini"
          printf 'hw.lcd.width=540\nhw.lcd.height=1200\nhw.lcd.density=210\n' >> "$ANDROID_AVD_HOME/t.avd/config.ini"
          ls -la "$ANDROID_AVD_HOME"
          emulator -list-avds
          set +x
          nohup emulator -avd t -cores 4 -memory 4096 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -no-metrics -camera-back none -camera-front none > "$OUT/emulator.txt" 2>&1 &
          booted=0
          EMU_PID=$!
          for i in $(seq 1 120); do
            kill -0 $EMU_PID 2>/dev/null || { echo "emulator process exited"; break; }
            if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          tail -60 "$OUT/emulator.txt"
          adb devices
          [ "$booted" = "1" ] || { echo "emulator did not boot"; exit 1; }
          adb shell input keyevent 82
          sleep 45   # let the launcher and system settle before testing

      - name: Run the test
        timeout-minutes: 20
        run: |
          OUT="$RUNNER_TEMP/results"
          timeout 1080 bash .github/scripts/emu-test.sh "$OUT" > "$OUT/run.txt" 2>&1 || echo "test script exit $?"
          tail -30 "$OUT/run.txt"
          python3 .github/scripts/analyze.py "$OUT/log.txt" "$OUT/screen.txt" > "$OUT/summary.txt" 2>&1 || true
          cat "$OUT/summary.txt"

      - name: Publish results to the test-results branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/results"
          cd "$RUNNER_TEMP" && rm -rf tr && mkdir tr && cd tr
          git init -q
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          set -x
          if git fetch -q --depth 1 origin test-results; then
            git checkout -q -b test-results FETCH_HEAD
          else
            git symbolic-ref HEAD refs/heads/test-results   # first run: start the branch
          fi
          # main -> latest/, any other branch (e.g. the old version as a baseline) -> its name
          D=latest; [ "${GITHUB_REF_NAME}" = main ] || D="${GITHUB_REF_NAME}"
          rm -rf "$D" && mkdir "$D"
          cp -r "$OUT"/. "$D"/ 2>/dev/null || true
          { echo "=== run ${{ github.run_number }} ${GITHUB_REF_NAME} commit ${GITHUB_SHA::7} $(date -u +%FT%TZ)"; cat "$D"/summary.txt 2>/dev/null || echo "(no summary)"; echo; } >> history.txt
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "emulator run ${{ github.run_number }} (${GITHUB_SHA::7})"
          for i in 1 2 3; do git push -q origin test-results && break; git pull -q --rebase origin test-results; done
