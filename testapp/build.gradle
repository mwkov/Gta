plugins {
    id 'com.android.application'
}

// Test harness only: shows content with "GTA" lines and logs where they are on screen every
// frame, so the emulator test can measure exactly how well Spoiler Shield covers them.
android {
    namespace 'dev.mwkov.shieldtest'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.mwkov.shieldtest'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
